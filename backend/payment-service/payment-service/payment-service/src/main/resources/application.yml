server:
  port: 0   # Random port

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DATABASE:elearning}
    username: ${SPRING_DATASOURCE_USERNAME:tagam}
    password: ${SPRING_DATASOURCE_PASSWORD:tagam123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    prefer-ip-address: true

# Stripe configuration (use test keys)
stripe:
  secret-key: sk_test_your_stripe_secret_key_here
  webhook-secret: whsec_your_webhook_secret_here