name: E-Learning Platform CI/CD

on:
  push:
    branches: [ main, develop, tagam ]
  pull_request:
    branches: [ main, tagam ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elearn
          POSTGRES_PASSWORD: elearn123
          POSTGRES_DB: elearning
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ================== BACKEND TESTS ==================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit Tests (Exam Service)
        run: |
          cd backend/exam-service
          ./mvnw test --no-transfer-progress

      - name: Build All Backend Services
              run: |
                cd backend/user-service/user-service/user-service && ./mvnw clean package -DskipTests -B --no-transfer-progress
                cd $GITHUB_WORKSPACE/backend/course-service && ./mvnw clean package -DskipTests -B --no-transfer-progress
                cd $GITHUB_WORKSPACE/backend/exam-service && ./mvnw clean package -DskipTests -B --no-transfer-progress
                cd $GITHUB_WORKSPACE/backend/payment-service/payment-service/payment-service && ./mvnw clean package -DskipTests -B --no-transfer-progress

      # ================== FRONTEND BUILD ==================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Build React Frontend
        run: cd frontend && npm run build

      # ================== DOCKER BUILD ==================
      - name: Build Docker Images
        run: |
          cd backend
          docker compose build --no-cache

      - name: Run Docker Compose (Health Check)
        run: |
          cd backend
          docker compose up -d
          sleep 30
          docker compose ps
          docker compose logs --tail=50